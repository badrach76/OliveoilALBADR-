<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب منتج - شركة زيت البدر بالعطاوية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #fcfbf7;
            --primary-deep: #12281e;
            --accent-gold: #c5a059;
            --accent-gold-light: #e6d5b8;
            --text-main: #2c2c2c;
            --text-muted: #666666;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(18, 40, 30, 0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-main); color: var(--text-main); line-height: 1.9; overflow-x: hidden; }

        /* حركة الظهور التدريجي السلسة */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            background-color: var(--white); padding: 1.2rem 6%; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--accent-gold-light);
            animation: fadeInUp 0.6s ease-out forwards;
        }
        .logo-wrapper { display: flex; align-items: center; gap: 14px; text-decoration: none; }
        .logo-wrapper img { height: 52px; width: auto; object-fit: contain; transition: transform 0.4s ease; }
        .logo-wrapper:hover img { transform: scale(1.05); }

        .brand-title { display: flex; flex-direction: column; justify-content: center; }
        .brand-title .ar-name { font-family: 'Amiri', serif; font-size: 1.35rem; font-weight: 700; color: var(--primary-deep); line-height: 1.2; }
        .brand-title .en-name { font-size: 0.75rem; color: var(--accent-gold); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; line-height: 1.2; }

        nav ul { list-style: none; display: flex; gap: 25px; align-items: center; }
        nav ul li a { color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: color 0.3s; position: relative; }
        nav ul li a:hover, nav ul li a.active { color: var(--accent-gold); }
        .menu-toggle { display: none; background: none; border: none; cursor: pointer; font-size: 1.8rem; color: var(--primary-deep); }

        .page-header {
            background: linear-gradient(rgba(18, 40, 30, 0.8), rgba(18, 40, 30, 0.65)), url('https://images.unsplash.com/photo-1541604193435-245c58394cf0?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            padding: 90px 10%; text-align: center; color: var(--white);
            animation: fadeInUp 0.8s ease-out forwards;
        }
        .page-header h1 { font-family: 'Amiri', serif; font-size: 3rem; margin-bottom: 10px; font-weight: 700; }
        .page-header p { font-family: 'Amiri', serif; font-size: 1.15rem; color: #eae6df; font-weight: 300; }

        .order-content { padding: 90px 8%; max-width: 950px; margin: 0 auto; }
        .order-form-card {
            background-color: var(--white); padding: 50px; border-radius: 8px; box-shadow: var(--shadow); border-top: 5px solid var(--accent-gold);
            animation: fadeInUp 1s ease-out forwards;
        }
        .order-form-card h2 { font-family: 'Amiri', serif; color: var(--primary-deep); font-size: 2.2rem; margin-bottom: 10px; font-weight: 700; text-align: center; }
        .order-form-card > p { color: var(--text-muted); text-align: center; margin-bottom: 40px; font-family: 'Amiri', serif; font-size: 1.1rem; }
        .form-section-title { font-family: 'Amiri', serif; color: var(--primary-deep); font-size: 1.3rem; margin: 30px 0 15px 0; padding-bottom: 8px; border-bottom: 1px solid var(--accent-gold-light); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--primary-deep); font-weight: 600; font-size: 0.95rem; }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 14px 18px; border: 1.5px solid #dcd6c8; border-radius: 6px; font-family: 'Tajawal', sans-serif; font-size: 1.02rem; color: var(--primary-deep); background-color: var(--white);
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .form-group select {
            appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2312281e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: left 15px center; background-size: 16px; cursor: pointer;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--accent-gold); box-shadow: 0 0 0 4px rgba(197, 160, 89, 0.15); transform: translateY(-1px);
        }
        .products-selection-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        
        .product-option-row {
            display: grid; grid-template-columns: 2fr 1fr; align-items: center; background-color: var(--bg-main); border: 1.5px solid #eae5d9; padding: 15px 20px; border-radius: 6px; gap: 20px;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .product-option-row:hover {
            border-color: var(--accent-gold); transform: translateX(-4px); box-shadow: 0 4px 12px rgba(18, 40, 30, 0.04); background-color: #fff;
        }
        .checkbox-label { display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 600; color: var(--primary-deep); font-size: 1.05rem; }
        .checkbox-label input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary-deep); cursor: pointer; }
        .product-qty-input { padding: 10px 12px; border: 1px solid #dcd6c8; border-radius: 4px; font-family: 'Tajawal', sans-serif; font-size: 0.95rem; background-color: var(--white); text-align: center; }
        
        .price-display-box { background-color: var(--bg-main); border: 1.5px dashed var(--accent-gold); padding: 20px; border-radius: 6px; text-align: center; margin: 25px 0; transition: transform 0.3s ease; }
        .price-display-box:hover { transform: scale(1.01); }
        .price-display-box h4 { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 5px; }
        .price-display-box span { color: var(--primary-deep); font-size: 1.15rem; font-weight: 700; font-family: 'Amiri', serif; }
        
        .btn-submit-order {
            background-color: var(--primary-deep); color: var(--white); padding: 16px; border: none; border-radius: 6px; font-weight: 700; font-size: 1.1rem; cursor: pointer; width: 100%; margin-top: 10px;
            box-shadow: 0 6px 20px rgba(18, 40, 30, 0.2);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .btn-submit-order:hover {
            background-color: var(--accent-gold); color: var(--primary-deep); transform: translateY(-4px); box-shadow: 0 10px 25px rgba(197, 160, 89, 0.4);
        }
